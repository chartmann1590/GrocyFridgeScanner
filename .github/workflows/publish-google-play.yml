name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      confirm_play_publish:
        description: 'Type "publish" to confirm submission to Google Play production'
        required: true
        default: ''
      release_notes:
        description: 'Release notes (optional; uses recent commits if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    name: Build & publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
      GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
      GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}

    steps:
      - name: Check confirmation
        if: github.event.inputs.confirm_play_publish != 'publish'
        run: |
          echo "::error::You must type 'publish' in confirm_play_publish to proceed."
          exit 1

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Auto-increment versionCode and commit
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BUILD_FILE="app/build.gradle.kts"

          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' "$BUILD_FILE")
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $NEW_CODE/" "$BUILD_FILE"

          CURRENT_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$BUILD_FILE")
          NEW_NAME="${CURRENT_NAME%.*}.$NEW_CODE"
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]+\"/versionName = \"$NEW_NAME\"/" "$BUILD_FILE"

          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NEW_NAME" >> "$GITHUB_OUTPUT"

          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${NEW_NAME} for Play Store release"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto latest master..."
            git pull --rebase origin master
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push versionCode bump after 5 attempts" >&2
          exit 1

      - name: Build signed release bundle
        env:
          KEYSTORE_FILE: app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.KEY_ALIAS_PASSWORD }}
          AD_MOB_APP_ID: ${{ secrets.AD_MOB_APP_ID }}
          AD_MOB_BANNER_ID: ${{ secrets.AD_MOB_BANNER_ID }}
          AD_MOB_INTERSTITIAL_ID: ${{ secrets.AD_MOB_INTERSTITIAL_ID }}
        run: ./gradlew bundleRelease

      - name: Generate release notes
        run: |
          WHATSNEW_DIR="distribution/whatsnew"
          mkdir -p "${WHATSNEW_DIR}"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "${WHATSNEW_DIR}/whatsnew-en-US"
          elif git describe --tags --abbrev=0 HEAD^ 2>/dev/null; then
            PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)"
            git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' > "${WHATSNEW_DIR}/whatsnew-en-US"
          else
            printf '%s\n' "Bug fixes and performance improvements." > "${WHATSNEW_DIR}/whatsnew-en-US"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Verify service account key
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is missing."
            exit 1
          fi
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.charleshartmann.grocyfridge
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
          whatsNewDirectory: distribution/whatsnew
